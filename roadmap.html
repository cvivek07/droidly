<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f4f6f9;--bg3:#eaecf0;--card:#fff;
  --ink:#0f1117;--ink2:#374151;--muted:#6b7280;
  --green:#3d7a4f;--green2:#2e6040;--green-mid:#4caf70;--green-light:#e8f2ec;--green-pale:#f0f8f2;
  --amber:#b45309;--amber-bg:#fef3c7;--red:#b91c1c;--red-bg:#fee2e2;
  --border:rgba(15,17,23,0.08);--border-green:rgba(61,122,79,0.2);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.05),0 1px 2px rgba(0,0,0,0.03);
  --shadow-md:0 4px 16px rgba(0,0,0,0.07),0 2px 6px rgba(0,0,0,0.04);
}
html{scroll-behavior:smooth}
body{background:var(--bg2);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:16px;line-height:1.55;padding-top:68px;min-height:100vh}
a{color:inherit}
button{font-family:inherit}
/* NAV (matches other pages) */
nav{position:fixed;top:0;left:0;right:0;z-index:900;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
nav::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green2),var(--green-mid),var(--green))}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.5px}
.logo img{height:32px;width:auto;display:block}
.nav-center{display:flex;gap:4px}
.nav-link{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;padding:7px 14px;border-radius:8px}
.nav-link:hover,.nav-link.active{color:var(--ink);background:var(--bg2)}
.nav-right{display:flex;align-items:center;gap:10px}
.btn-nav{background:var(--ink);color:#fff;padding:9px 22px;border-radius:100px;font-size:14px;font-weight:600;border:none;cursor:pointer}
.btn-nav:hover{background:var(--green)}
.nav-user{display:none;align-items:center;gap:8px;position:relative;cursor:pointer}
.nav-avatar{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.nav-user-name{font-size:14px;font-weight:600}
.user-dropdown{display:none;position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-md);min-width:200px;padding:6px}
.nav-user:hover .user-dropdown,.nav-user:focus-within .user-dropdown{display:block}
.user-dropdown-email{font-size:12px;color:var(--muted);padding:8px 12px}
.user-dropdown-item{display:block;padding:9px 12px;border-radius:8px;font-size:14px;text-decoration:none;cursor:pointer;color:var(--ink2)}
.user-dropdown-item:hover{background:var(--bg2)}
.user-dropdown-item.danger{color:var(--red)}
/* LAYOUT */
.wrap{max-width:1080px;margin:0 auto;padding:36px 24px 80px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-sm);padding:26px}
h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;letter-spacing:-.8px;font-size:34px;line-height:1.15}
h2{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;letter-spacing:-.4px;font-size:20px}
.sub{color:var(--muted);margin-top:8px}
.eyebrow{display:inline-block;font-size:12px;font-weight:700;color:var(--green);background:var(--green-light);border:1px solid var(--border-green);border-radius:100px;padding:4px 12px;margin-bottom:14px}
/* FORM */
.q-num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--green-light);color:var(--green);font-size:12px;font-weight:800;margin-right:9px;vertical-align:1px}
.lvl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chip.lvl-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border-radius:14px;padding:14px 16px;text-align:left;font-family:inherit}
.lvl-card .lvl-top{display:flex;flex-direction:column;gap:2px}
.lvl-card .lvl-top b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.lvl-card .lvl-top em{font-style:normal;font-size:12px;font-weight:700;color:var(--green)}
.lvl-card .lvl-desc{font-size:12.5px;font-weight:500;line-height:1.4;color:var(--muted)}
.lvl-card[aria-pressed=true]{background:linear-gradient(135deg,#2e6040,#3f9a6c);border-color:transparent;box-shadow:0 10px 24px rgba(46,96,64,.28)}
.lvl-card[aria-pressed=true] .lvl-top em,.lvl-card[aria-pressed=true] .lvl-desc{color:rgba(255,255,255,.88)}
.jd-box{border:1.5px dashed var(--bg3);border-radius:14px;padding:12px 16px}
.jd-box summary{cursor:pointer;list-style:none}.jd-box summary::-webkit-details-marker{display:none}
.jd-box summary .q-label{margin:0}.jd-box[open] summary{margin-bottom:12px}
.ob-sum{margin-top:26px;padding:12px 16px;border-radius:12px;background:var(--green-light);color:var(--ink2);font-size:14px}
@media(max-width:600px){.lvl-grid{grid-template-columns:1fr}}
.q-group{margin-top:24px}
.q-label{font-weight:700;font-size:15px;margin-bottom:10px}
.q-label small{font-weight:500;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--bg3);background:#fff;border-radius:100px;padding:9px 18px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--green)}
.chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
input[type=date],input[type=email],input[type=password]{font:inherit;padding:10px 14px;border:1.5px solid var(--bg3);border-radius:10px;background:#fff;color:var(--ink);width:100%}
input[type=date]{width:auto}
input:focus{outline:none;border-color:var(--green)}
.actions{display:flex;align-items:center;gap:16px;margin-top:30px;flex-wrap:wrap}
.btn{background:var(--green);color:#fff;border:none;border-radius:100px;padding:13px 26px;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s}
.btn:hover{background:var(--green2);transform:translateY(-1px)}
.btn.ghost{background:#fff;color:var(--ink2);border:1.5px solid var(--bg3)}
.btn.ghost:hover{border-color:var(--green);color:var(--green2)}
.btn.small{padding:8px 16px;font-size:13px}
.link-btn{background:none;border:none;color:var(--muted);font-size:14px;text-decoration:underline;cursor:pointer}
/* SELF CHECK */
.rate-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--border);flex-wrap:wrap}
.rate-row:first-of-type{border-top:none}
.rate-name{font-weight:600}
.seg{display:inline-flex;border:1.5px solid var(--bg3);border-radius:100px;overflow:hidden}
.seg button{border:none;background:#fff;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button+button{border-left:1.5px solid var(--bg3)}
.seg button[aria-pressed=true].s-strong{background:var(--green);color:#fff}
.seg button[aria-pressed=true].s-shaky{background:#f59e0b;color:#fff}
.seg button[aria-pressed=true].s-new{background:#ef4444;color:#fff}
/* DASHBOARD */
.grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.grid>div{min-width:0}
.score-card{display:flex;flex-direction:column;align-items:center;text-align:center}
.ring{position:relative;width:150px;height:150px;margin:6px 0 10px}
.ring svg{transform:rotate(-90deg)}
.ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num b{font-family:'Plus Jakarta Sans',sans-serif;font-size:40px;line-height:1}
.ring-num span{font-size:12px;color:var(--muted)}
.meta-line{font-size:14px;color:var(--ink2);margin-top:6px}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:100px;padding:3px 10px;white-space:nowrap}
.pill.strong{background:var(--green-light);color:var(--green2)}
.pill.needs{background:var(--amber-bg);color:var(--amber)}
.pill.weak{background:var(--red-bg);color:var(--red)}
.pill.none{background:var(--bg3);color:var(--muted)}
.pill.easy{background:var(--green-light);color:var(--green2)}.pill.medium{background:var(--amber-bg);color:var(--amber)}.pill.hard{background:var(--red-bg);color:var(--red)}
.pill.lock{background:#eef2ff;color:#3730a3}
.disclaimer{font-size:12px;color:var(--muted);margin-top:12px}
.topic{padding:11px 0;border-top:1px solid var(--border)}
.topic:first-child{border-top:none}
.topic-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.topic-name{font-weight:600;font-size:14px}
.bar{height:7px;border-radius:99px;background:var(--bg3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--green)}
.bar>i.needs{background:#f59e0b}.bar>i.weak{background:#ef4444}.bar>i.none{background:#cbd5e1}
.topic-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;color:var(--muted);gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0 6px;padding-bottom:4px}
.tab{border:1.5px solid var(--bg3);background:#fff;border-radius:10px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tab-saved{margin-right:6px;position:relative}.tab-saved::after{content:'';position:absolute;right:-7px;top:6px;bottom:6px;width:1px;background:var(--bg3)}
.tab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.sec-title{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--border)}
.task:first-of-type{border-top:none}
.check{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--bg3);margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.task.done .check{background:var(--green);border-color:var(--green)}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-title{font-weight:600;text-decoration:none;display:block}
.t-title:hover{color:var(--green2)}
.t-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--muted)}
.t-right{flex:none;display:flex;gap:8px;align-items:center;margin-left:8px}
.ic-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--bg3);background:#fff;color:#c4c9d2;display:grid;place-items:center;cursor:pointer;padding:0;transition:all .15s}
.ic-btn:hover{border-color:var(--green);color:var(--green)}
.ic-done[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.ic-save:hover{border-color:#e6b25c;color:#d99a2b}
.ic-save[aria-pressed=true]{border-color:#f1c76b;background:var(--amber-bg);color:#e0a21c}
.task{align-items:center}
.t-act{display:flex;gap:6px;margin-top:8px}
.mini{border:1px solid var(--bg3);background:#fff;border-radius:100px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.mini:hover{border-color:var(--green);color:var(--green2)}
.mini[aria-pressed=true]{background:var(--green-light);border-color:var(--green);color:var(--green2)}
.mini.act-done[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.mini.act-save[aria-pressed=true]{background:var(--amber-bg);border-color:#e6b25c;color:var(--amber)}
.mini{padding:6px 14px;font-size:13px}
.progress-line{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--ink2);margin-top:4px;flex-wrap:wrap}
.banner{background:var(--green-pale);border:1px solid var(--border-green);border-radius:14px;padding:12px 16px;font-size:14px;color:var(--ink2);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.note{background:var(--amber-bg);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--amber);margin-top:12px}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.saved a{display:block;padding:8px 0;border-top:1px solid var(--border);font-size:14px;text-decoration:none}
.saved a:first-child{border-top:none}
.saved a:hover{color:var(--green2)}
.saved small{color:var(--muted)}
/* MODAL + TOAST */
.modal-bg{position:fixed;inset:0;background:rgba(15,17,23,.5);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:20px;padding:28px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{margin-bottom:4px}
.modal .f{margin-top:12px}
.modal label{font-size:13px;font-weight:600;display:block;margin-bottom:5px}
.divider{text-align:center;color:var(--muted);font-size:12px;margin:14px 0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:1100;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.hidden{display:none!important}
@media(max-width:860px){
  nav{padding:0 16px}.nav-center{display:none}
  .grid{grid-template-columns:minmax(0,1fr)}
  h1{font-size:28px}
  .wrap{padding:24px 16px 60px}
}
.lv-row{align-self:stretch;width:100%;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.lv{display:grid;grid-template-columns:64px 1fr 34px;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--ink2)}
.lv .lv-name{font-weight:600}
.lv b{text-align:right;font-variant-numeric:tabular-nums}
.lv.target .lv-name,.lv.target b{color:var(--green2)}
.lv.target .bar{outline:2px solid var(--border-green);outline-offset:2px}
.info{cursor:help;color:var(--muted);margin-left:2px}
.lv-note{font-size:12px;color:var(--muted);margin-top:8px}
.skill{padding:13px 0;border-top:1px solid var(--border)}
.skill:first-child{border-top:none}
.skill-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.skill-rank{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.skill-basis{font-size:11px;color:var(--muted);margin-left:auto}
.skill-why{list-style:none;margin:7px 0 0 32px;padding:0;font-size:13px;color:var(--ink2)}
.skill-why li{margin-top:3px}
.skill-go{display:block;margin:9px 0 0 32px;font-size:13px;font-weight:600;color:var(--green2);text-decoration:none}
.skill-go:hover{text-decoration:underline}
.skill-go small{font-weight:500;color:var(--muted)}
.jd-in{font:inherit;width:100%;padding:10px 14px;border:1.5px solid var(--bg3);border-radius:10px;background:#fff;color:var(--ink);resize:vertical}
.jd-detect{font-size:13px;color:var(--ink2);margin-top:8px;min-height:18px}
.jd-detect .pill{margin:2px 4px 2px 0}
.dg-prog{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);margin-bottom:14px}
.dg-prog .bar{flex:1;margin:0}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:15px;line-height:1.45;padding:12px 16px;margin-top:10px;border:1.5px solid var(--bg3);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--green)}
.opt[aria-pressed=true]{border-color:var(--green);background:var(--green-pale)}
.opt.right{border-color:var(--green);background:var(--green-light)}
.opt.wrong{border-color:#ef4444;background:var(--red-bg)}
.opt[disabled]{cursor:default}
.dg-fb{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--bg2);font-size:14px;color:var(--ink2)}
.dg-fb b{color:var(--ink)}
.dg-fb.bad{background:var(--red-bg)}.dg-fb.ok{background:var(--green-pale)}
.ck{list-style:none;margin:10px 0 0;padding:0;font-size:14px}
.ck li{padding:5px 0 5px 26px;position:relative}
.ck li::before{content:"✗";position:absolute;left:2px;color:#ef4444;font-weight:700}
.ck li.hit::before{content:"✓";color:var(--green)}
.dg-ta{font:inherit;width:100%;min-height:150px;padding:12px 14px;border:1.5px solid var(--bg3);border-radius:12px;background:#fff;color:var(--ink);resize:vertical;margin-top:12px}
.dg-big{font-size:34px;font-weight:800;letter-spacing:-.02em}
.dg-row{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:14px}
.dg-row .nm{flex:0 0 150px;font-weight:600}.dg-row .bar{flex:1;margin:0}.dg-row small{flex:0 0 auto;color:var(--muted)}
.dg-note{font-size:12px;color:var(--muted);margin-top:14px}
@media(max-width:560px){.dg-row{flex-wrap:wrap}.dg-row .nm{flex:1 0 100%}}

/* ===== colourful pass (matches the homepage palette) ===== */
:root{--a1:#3d7a4f;--b1:#5cc07f;--a2:#1f8a99;--b2:#4cc4d3;--a3:#d9902f;--b3:#f3c45f;--a4:#e0583f;--b4:#f59372;--a5:#5566d9;--b5:#8f98f4;--a6:#9150d8;--b6:#c58ff2}
body{background:linear-gradient(160deg,#e9f7ef 0%,#e7f1fb 38%,#fff3e4 72%,#fdebf3 100%) fixed}
.dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:26px 28px;border-radius:26px;color:#fff;background:linear-gradient(115deg,#2e6040 0%,#1f8a99 55%,#5566d9 100%);box-shadow:0 18px 40px rgba(31,100,120,.25);position:relative;overflow:hidden}
.dash-head::after{content:"";position:absolute;right:-60px;top:-70px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 68%);pointer-events:none}
.dash-head h1{color:#fff}.dash-head .sub{color:rgba(255,255,255,.88)}
.dash-head .eyebrow{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:#fff}
.dash-head .btn{background:#fff;color:#1c5a45;border-color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.18);position:relative;z-index:1}
.dash-head .btn:hover{background:#f3fff8;color:#14442f}
.grid .card{border:0;border-radius:24px;box-shadow:0 10px 30px rgba(40,50,90,.09);position:relative;overflow:hidden}
.grid .card::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--ca,#3d7a4f),var(--cb,#5cc07f))}
.grid>div:first-child>.card:nth-child(1){--ca:var(--a1);--cb:var(--b1);background:linear-gradient(180deg,#f1fbf5 0%,#fff 46%)}
.grid>div:first-child>.card:nth-child(2){--ca:var(--a5);--cb:var(--b5);background:linear-gradient(180deg,#eff1ff 0%,#fff 60%)}
.grid>div:first-child>.card:nth-child(3){--ca:var(--a4);--cb:var(--b4);background:linear-gradient(180deg,#fff2ee 0%,#fff 30%)}

.chev{flex:none}
.cl-card{display:flex;align-items:center;gap:18px;margin-top:20px;padding:22px 24px;border-radius:24px;text-decoration:none;color:var(--ink);background:linear-gradient(115deg,#fff 0%,color-mix(in srgb,var(--cb) 16%,#fff) 100%);box-shadow:0 10px 30px rgba(40,50,90,.09);position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}

.tp-card{border:0!important;border-radius:24px!important;box-shadow:0 10px 30px rgba(40,50,90,.09)!important;position:relative;overflow:hidden;padding:26px 28px}

#markDone:not(.ghost){background:linear-gradient(100deg,var(--ca),var(--cb))}
.tp-body{margin-top:16px;border:0!important;border-radius:24px!important;box-shadow:0 10px 30px rgba(40,50,90,.07)!important}

.ln-main h2{font-size:24px;margin:4px 0 10px}
.ln-p{font-size:15.5px;line-height:1.7;color:var(--ink2);margin-top:10px}

.ln-p b{color:var(--ink)}

.ln-ex{margin-top:22px}
.ln-ex-h{font-size:14px;font-weight:700;margin-bottom:8px}
.ln-code{border-radius:16px;overflow:hidden;background:#0f1a24;box-shadow:0 10px 26px rgba(15,26,36,.18)}
.ln-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 8px 16px;background:#16232f;color:#9fb3c4;font-size:12px;font-weight:700}
.ln-copy{font:inherit;font-size:12px;color:#d6e3ee;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:4px 10px;cursor:pointer}
.ln-copy:hover{background:rgba(255,255,255,.16)}
.ln-code pre{margin:0;padding:16px 18px;overflow-x:auto;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#e6edf3;white-space:pre;tab-size:4}

.hl-k{color:#ff8fa3}.hl-s{color:#a5e3a0}.hl-c{color:#7f93a6;font-style:italic!important}.hl-a{color:#f6c177}.hl-n{color:#f6c177}.hl-t{color:#82c7ff}
.ln-tip{display:flex;gap:12px;margin-top:22px;padding:14px 16px;border-radius:16px;background:linear-gradient(110deg,#e9f8ef,#eef9fb);border:1px solid rgba(61,122,79,.18)}

.ln-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--border);flex-wrap:wrap}

/* ===== lesson deep dives ===== */
.ln-toc{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 14px;padding:12px 14px;border-radius:14px;background:var(--bg2)}

.ln-qa{margin-top:24px;padding:18px 20px;border-radius:18px;background:linear-gradient(120deg,color-mix(in srgb,var(--cb) 18%,#fff),#fff);border:1.5px solid color-mix(in srgb,var(--ca) 30%,#fff)}
.ln-qa-k{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ca)}
.ln-qa-q{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:17px;line-height:1.45;margin-top:6px}

@media(max-width:640px){.ln-mis-h{display:none}.ln-mis-r{grid-template-columns:1fr}.ln-mis-r .bad::before{content:"✕ ";color:#b6341c;font-weight:800}.ln-mis-r .good::before{content:"✓ ";color:#1d6b3e;font-weight:800}.ln-toc{flex-wrap:nowrap;overflow-x:auto}.ln-toc button{flex:none}}

/* ===== Homepage theme (calm, solid deep green; matches the redesigned homepage) ===== */
:root{--hg:#2e6040;--hg2:#244d33;--hg-dark:#0f2a1d;--hg-tint:#e8f2ec;--hg-bg:#f4f7f5;--hg-line:#e3e8e5}
body{background:var(--hg-bg) !important}
.eyebrow{color:var(--hg);background:var(--hg-tint);border-color:#c9e0d1}
.btn{background:var(--hg);box-shadow:none}
.btn:hover{background:var(--hg2)}
.btn.ghost{background:#fff;color:var(--hg);border:1.5px solid var(--hg)}
.btn.ghost:hover{background:var(--hg-tint);color:var(--hg2)}
.card{border:1px solid var(--hg-line);border-radius:22px;box-shadow:0 10px 30px rgba(30,40,60,.07)}
/* onboarding */
.lvl-card[aria-pressed=true]{background:var(--hg) !important;box-shadow:0 8px 20px rgba(46,96,64,.22) !important}
.chip[aria-pressed=true]{background:var(--hg);border-color:var(--hg)}
.ob-sum{background:var(--hg-tint)}
/* dashboard header: solid dark green band like the homepage proof strip */
.dash-head{background:var(--hg-dark) !important;box-shadow:none !important;border-radius:24px}
.dash-head::after{display:none !important}
.dash-head .btn{background:#fff !important;color:var(--hg-dark) !important;box-shadow:none !important}
.dash-head .btn:hover{background:var(--hg-tint) !important}
/* cards: plain white, no coloured stripes or washes */
.grid .card,.grid>div:first-child>.card,.grid>div:last-child>.card:first-child{background:#fff !important;border:1px solid var(--hg-line) !important;border-radius:22px !important;box-shadow:0 10px 30px rgba(30,40,60,.07) !important}
.grid .card::before{display:none !important}
.ring-num b{background:none !important;-webkit-text-fill-color:currentColor !important;color:var(--hg-dark) !important}

.lv .bar i,.bar>i,.topic .bar i{background:#3d7a4f !important}
.bar>i.needs{background:#d9822b !important}.bar>i.weak{background:#d9482f !important}.bar>i.none{background:#cbd5e1 !important}
.tab{border-radius:100px;background:#fff}

.skill-rank{background:var(--hg) !important}
.skill-go{color:var(--hg)}
.ic-done[aria-pressed=true]{background:var(--hg) !important;border-color:var(--hg) !important}
.sec-title{color:var(--muted)}
.task:hover{background:#f7faf8 !important}
/* continue card */
.cl-card{background:#fff !important;border:1px solid var(--hg-line);box-shadow:0 10px 30px rgba(30,40,60,.07)}

.cl-card:hover{box-shadow:0 18px 40px rgba(30,40,60,.12)}
.cl-kick{color:var(--hg) !important}
.cl-go{background:var(--hg) !important;box-shadow:none !important}
.cl-prog .bar i,.tp-prog .bar i,.rm-bar i{background:#3d7a4f !important}

.rm-row.completed .rm-ic{background:var(--hg) !important}
/* topic page */
.tp-card{border:1px solid var(--hg-line) !important;box-shadow:0 10px 30px rgba(30,40,60,.07) !important}

.tp-ring b{color:var(--hg-dark) !important}
#markDone:not(.ghost){background:var(--hg) !important}
.tp-body{border:1px solid var(--hg-line) !important;box-shadow:0 10px 30px rgba(30,40,60,.06) !important}
.tp-nav{border:1px solid var(--hg-line);box-shadow:none}
.banner{background:var(--hg-tint);border-color:#c9e0d1}
/* lessons */
.ln-step{color:var(--hg) !important}
.ln-item:hover{background:#f7faf8 !important}
.ln-item.on{background:var(--hg-tint) !important;border-color:#c9e0d1 !important}
.ln-item.on .ln-n{background:var(--hg) !important}
.ln-toc button:hover{border-color:var(--hg) !important;color:var(--hg) !important}
.ln-sec .ln-h3{border-left:0 !important;padding-left:0 !important}
.ln-pts li::before{background:#3d7a4f !important}
.ln-p code,.ln-pts code,.ln-tip code{background:#eef2ef !important}
.ln-tip{background:var(--hg-tint) !important;border-color:#c9e0d1 !important}
.ln-qa{background:#fff !important;border:1.5px solid var(--hg-line) !important}
.ln-qa-k,.ln-qa summary{color:var(--hg) !important}
.ln-qa details p{background:#f7faf8 !important}
.ln-nav .btn:not(.ghost){background:var(--hg) !important}
.lesson:hover,.art:hover{border-color:var(--hg) !important}
.ls-ic,.art-ic{background:#eef2ef !important}
/* skill check */
.opt:hover,.opt[aria-pressed=true]{border-color:var(--hg)}
.opt.right{border-color:var(--hg);background:var(--hg-tint)}
@media(max-width:640px){.dash-head{border-radius:20px}}

/* no per-topic icons */
.rm-row{grid-template-columns:30px minmax(0,1fr) auto !important}

@media(max-width:640px){.rm-row{grid-template-columns:26px minmax(0,1fr) auto !important;padding:12px 8px}.rm-num{display:block !important}}

<script>
(function () {
  'use strict';
  var R = window.Readiness;
  var D = window.DroidlyDiagnostic;
  var SUPABASE_URL = 'https://dquheflcmcppldrnckzf.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxdWhlZmxjbWNwcGxkcm5ja3pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMjI1MDcsImV4cCI6MjA5MTY5ODUwN30.SRhP7mzqlaNzGYEec56IV348aAl66YmFv9ApBuXbN1c';
  var db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  window.DroidlyDb = db;   // the sign-in dialog reuses this client

  var app = document.getElementById('app');
  var index = null;
  var view = null;            // 'onboard' | 'dash' | 'diag'
  var editing = false;        // true when editing existing goals
  var draft = {};
  var selectedDay = 0;
  var user = null, isPremium = false, lockedTopics = {};
  var authReady = false;      // true once we know whether someone is signed in and, if so, their data has loaded
  var loadErr = null;         // set when a signed-in user's data could not be loaded

  var LEVELS = [['0-2', 'SDE 1', '0–2 years', 'Lifecycle, Kotlin basics, RecyclerView, core APIs'],
                ['2-5', 'SDE 2', '2–5 years', 'Architecture, Compose, coroutines, testing'],
                ['5+', 'SDE 3 / Senior', '5+ years', 'System design, performance, scale, leadership']];
  var COMPANIES = [['product', 'Product company'], ['startup', 'Startup'], ['service', 'Service company']];
  var MINUTES = [[30, '30 min'], [60, '1 hour'], [120, '2 hours']];
  var LEVEL_NAME = { '0-2': 'SDE 1 · 0–2 yrs', '2-5': 'SDE 2 · 2–5 yrs', '5+': 'SDE 3 · 5+ yrs' };
  var COMPANY_NAME = { product: 'Product company', startup: 'Startup', service: 'Service company' };

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function track(name, params) { try { window.gtag && gtag('event', name, params || {}); } catch (e) { /* analytics must never break the page */ } }
  function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 3500); }

  /* ---------- auth ---------- */
  R.configure({
    getSession: function () {
      return db.auth.getSession().then(function (r) {
        var s = r.data && r.data.session; return s ? { token: s.access_token, uid: s.user.id } : null;
      }).catch(function () { return null; });
    }
  });
  function setUser(u) {
    user = u;
    document.getElementById('navSignIn').style.display = u ? 'none' : '';
    document.getElementById('navUser').style.display = u ? 'flex' : 'none';
    if (u) {
      var name = (u.user_metadata && u.user_metadata.full_name) || u.email.split('@')[0];
      document.getElementById('navAvatar').textContent = name.split(' ').map(function (n) { return n[0]; }).join('').slice(0, 2).toUpperCase();
      document.getElementById('navName').textContent = name.split(' ')[0];
      document.getElementById('navEmail').textContent = u.email;
    }
  }
  // Same dialog as the homepage, opened in place so the visitor stays on this page.
  function openAuth(mode) { if (typeof window.openAuthModal === 'function') window.openAuthModal(mode === 'signup' ? 'signup' : 'signin'); else window.location.href = '/?auth=' + (mode === 'signup' ? 'signup' : 'signin') + '&return=roadmap'; }
  document.getElementById('navSignIn').onclick = function () { openAuth('signin'); };
  document.getElementById('navSignOut').onclick = function () {
    db.auth.signOut().then(function () { setUser(null); signedOut(); toast('Signed out.'); });
  };

  function loadEntitlements() {
    var anonH = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY };
    var jobs = [fetch(SUPABASE_URL + '/rest/v1/premium_topics?select=topic_id&is_locked=eq.true', { headers: anonH }).then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; })];
    if (user) {
      jobs.push(db.auth.getSession().then(function (r) {
        var tok = r.data.session && r.data.session.access_token; if (!tok) return [];
        return fetch(SUPABASE_URL + '/rest/v1/profiles?select=is_premium&id=eq.' + user.id, { headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + tok } })
          .then(function (x) { return x.ok ? x.json() : []; });
      }).catch(function () { return []; }));
    }
    return Promise.all(jobs).then(function (res) {
      lockedTopics = {}; (res[0] || []).forEach(function (r) { lockedTopics[r.topic_id] = 1; });
      isPremium = !!(res[1] && res[1][0] && res[1][0].is_premium);
    });
  }

  /* ---------- routing / render ---------- */
  function route() {
    var s = R.get();
    if (!view) view = s.goals ? 'dash' : 'onboard';
    render();
  }
  // Everything on this page is personal (goals, plan, skill check), so it needs an account.
  function renderGate() {
    track('roadmap_gate_shown', {});
    app.innerHTML = '<div class="card" style="max-width:720px;margin:0 auto"><span class="eyebrow">Free account</span><h1>Sign in to build your plan</h1>' +
      '<p class="sub">Your plan, skill-check results and progress are personal to you, so they are saved to your account and follow you across devices. Creating an account is free and takes under a minute.</p>' +
      '<ul class="ck" style="margin-top:14px"><li class="hit">A topic-by-topic learning path for your level and company type</li><li class="hit">A skill check that finds your real gaps</li><li class="hit">The same progress on your phone and your laptop</li></ul>' +
      '<div class="actions"><button class="btn" id="gateUp" type="button">Create free account</button><button class="btn ghost" id="gateIn" type="button">Sign in</button></div></div>';
    document.getElementById('gateUp').onclick = function () { track('roadmap_gate_click', { action: 'signup' }); openAuth('signup'); };
    document.getElementById('gateIn').onclick = function () { track('roadmap_gate_click', { action: 'signin' }); openAuth('signin'); };
  }
  function settle(err) {
    authReady = true; loadErr = err || null;
    // /roadmap#edit (from the profile page): open goal editing straight away
    if (!err && location.hash === '#edit' && R.get().goals) { editing = true; view = 'onboard'; try { history.replaceState(null, '', location.pathname); } catch (e) { /* ignore */ } }
    if (index) { if (!err) view = view || (R.get().goals ? 'dash' : 'onboard'); render(); }
  }
  function render() {
    if (!index) return;
    if (!authReady) { app.innerHTML = '<div class="card" style="max-width:720px;margin:0 auto"><p class="sub">Loading your progress…</p></div>'; return; }
    if (!user && !loadErr) return renderGate();
    if (loadErr) {
      var setupMissing = /PGRST205|PGRST204|42P01|schema cache/.test(String(loadErr));
      app.innerHTML = '<div class="card" style="max-width:720px;margin:0 auto"><h2>' + (setupMissing ? 'Setup is not finished' : 'Could not load your progress') + '</h2><p class="sub">' + (setupMissing ? 'The database tables that store your progress have not been created yet. Run the Supabase migration, then try again.' : 'Your saved plan lives in your account, so we will not start a new one on top of it. Check your connection and try again.') + ' (' + esc(loadErr) + ')</p><div class="actions"><button class="btn" id="retryLoad" type="button">Try again</button></div></div>';
      document.getElementById('retryLoad').onclick = function () { loadErr = null; authReady = false; render(); R.sync().then(function (r) { settle(r && r.ok ? null : (r && r.reason) || 'network'); }); };
      return;
    }
    if (view === 'onboard') return renderOnboard();
    if (view === 'diag') return renderDiag();
    renderDash();
  }

  function chipGroup(key, options, current) {
    return '<div class="chips" role="group">' + options.map(function (o) {
      return '<button type="button" class="chip" data-key="' + key + '" data-val="' + o[0] + '" aria-pressed="' + (String(current) === String(o[0])) + '">' + o[1] + '</button>';
    }).join('') + '</div>';
  }

  function levelCards(current) {
    return '<div class="lvl-grid" role="group">' + LEVELS.map(function (o) {
      return '<button type="button" class="chip lvl-card" data-key="level" data-val="' + o[0] + '" aria-pressed="' + (current === o[0]) + '">' +
        '<span class="lvl-top"><b>' + o[1] + '</b><em>' + o[2] + '</em></span><span class="lvl-desc">' + o[3] + '</span></button>';
    }).join('') + '</div>';
  }
  function qLabel(n, text, opt) { return '<div class="q-label"><span class="q-num">' + n + '</span>' + text + (opt ? ' <small>(optional)</small>' : '') + '</div>'; }

  function renderOnboard() {
    var g = Object.assign({}, R.DEFAULT_GOALS, R.get().goals || {}, draft);
    draft = { level: g.level, company: g.company, minutes: g.minutes, date: g.date };
    app.innerHTML =
      '<div class="card" style="max-width:720px;margin:0 auto">' +
      '<span class="eyebrow">' + (editing ? 'Check your goal, then take the skill check' : 'Free · about 10 minutes') + '</span>' +
      '<h1>' + (editing ? 'Rebuild your plan' : 'Build your Android interview roadmap') + '</h1>' +
      '<p class="sub">Tell us where you\'re headed. We\'ll turn the question bank into a topic-by-topic learning path, ordered for your level and company type.</p>' +
      '<div class="q-group">' + qLabel(1, 'Your level') + levelCards(g.level) + '</div>' +
      '<div class="q-group">' + qLabel(2, 'Where are you interviewing?') + chipGroup('company', COMPANIES, g.company) + '</div>' +
      '<div class="q-group">' + qLabel(3, 'Interview date', true) + '<input type="date" id="dateInput" min="' + R.ymd(new Date()) + '" value="' + (g.date || '') + '"/></div>' +
      '<details class="q-group jd-box"><summary>' + qLabel(4, 'Have a job description? Paste it to tailor your plan', true) + '</summary>' +
      '<textarea class="jd-in" id="jdInput" rows="4" maxlength="8000" placeholder="Paste the job description for the role you are targeting. It is read in your browser to see which topics it stresses. The text itself is not saved."></textarea>' +
      '<div class="jd-detect" id="jdDetect" aria-live="polite">' + jdSavedLine() + '</div></details>' +
      '<div class="ob-sum" id="obSum" aria-live="polite"></div>' +
      '<div class="actions"><button class="btn" id="goalNext" type="button">' + (editing ? 'Rebuild my plan' : 'Start my plan') + '</button>' +
      (editing ? '<button class="link-btn" id="goalCancel" type="button">Cancel</button>' : '') + '</div>' +
      '<p class="dg-note" style="margin-top:12px">Next: a short skill check (about 10 minutes) so your plan targets your real gaps.</p>' +
      '</div>';
    function paintSum() {
      var el = document.getElementById('obSum'); if (!el) return;
      el.innerHTML = '<b>Your plan:</b> ' + esc(LEVEL_NAME[draft.level]) + ' · ' + esc(COMPANY_NAME[draft.company]); 
    }
    app.querySelectorAll('.chip').forEach(function (b) {
      b.onclick = function () {
        var k = b.dataset.key; draft[k] = b.dataset.val;
        app.querySelectorAll('.chip[data-key="' + k + '"]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
        paintSum();
      };
    });
    paintSum();
    var jdDraft = null;
    var jdIn = document.getElementById('jdInput'), jdOut = document.getElementById('jdDetect');
    jdIn.oninput = function () {
      jdDraft = jdIn.value.trim().length > 20 ? D.analyzeJD(jdIn.value) : null;
      jdOut.innerHTML = jdDraft ? jdDetectHtml(jdDraft, draft.level) : jdSavedLine();
      bindJdOut(jdOut);
    };
    bindJdOut(jdOut);
    document.getElementById('goalNext').onclick = function () {
      draft.date = document.getElementById('dateInput').value || null;
      if (jdDraft && Object.keys(jdDraft.topics).length) { R.setJD(jdDraft); track('roadmap_jd_used', { topics: Object.keys(jdDraft.topics).length, level_hint: jdDraft.level || 'none' }); }
      R.setGoals(draft); R.ensurePlan(index, true); track('roadmap_goal_saved', { level: draft.level, company: draft.company, minutes: draft.minutes, has_date: !!draft.date });
      track('roadmap_plan_built', { source: 'goal_step' });
      var src = editing ? 'rebuild' : 'setup'; editing = false; draft = {};
      startDiag(src);
    };
    var cancel = document.getElementById('goalCancel');
    if (cancel) cancel.onclick = function () { editing = false; draft = {}; view = 'dash'; render(); };
  }

  function topicName(t) { return index.topics[t] ? index.topics[t].name : t; }
  function jdSavedLine() {
    var j = R.get().jd; if (!j) return '';
    var names = Object.keys(j.topics).map(topicName);
    return 'Job description applied (' + (names.length ? esc(names.join(', ')) : 'no topics found') + '). Paste a new one to replace it. <button type="button" class="link-btn" id="jdRemove">Remove</button>';
  }
  function jdDetectHtml(a, curLevel) {
    var top = a.top.slice(0, 6);
    if (!top.length && !a.level) return 'Could not find Android topics in that text. Nothing will be applied.';
    return 'Found: ' + top.map(function (x) { return '<span class="pill none">' + esc(topicName(x.topic)) + '</span>'; }).join('') +
      (a.level ? '<br>Experience hint: <b>' + esc(LEVEL_NAME[a.level]) + '</b> (' + esc(a.levelSource) + ')' +
        (a.level !== curLevel ? ' <button type="button" class="link-btn" id="jdUseLevel" data-level="' + a.level + '">Use ' + esc(LEVEL_NAME[a.level]) + '</button>' : '') : '');
  }
  function bindJdOut(out) {
    var rm = out.querySelector('#jdRemove'); if (rm) rm.onclick = function () { R.setJD(null); out.innerHTML = ''; };
    var ul = out.querySelector('#jdUseLevel');
    if (ul) ul.onclick = function () {
      draft.level = ul.dataset.level;
      app.querySelectorAll('.chip[data-key="level"]').forEach(function (x) { x.setAttribute('aria-pressed', x.dataset.val === draft.level); });
      ul.remove();
    };
  }

  function pillClass(label) { return label === 'Strong' ? 'strong' : label === 'Needs practice' ? 'needs' : label === 'Weak area' ? 'weak' : 'none'; }

  /* ---------- learning path: overview, topic page, saved ---------- */
  var TOPIC_INFO = {
    android: ['🤖', 'Activity and Fragment lifecycle, Intents, Services, Context and the core platform APIs.'],
    kotlin: ['📘', 'The language features interviewers probe: null safety, sealed and data classes, delegation, generics.'],
    compose: ['🎨', 'Declarative UI, state, recomposition, side effects and Compose performance.'],
    coroutines: ['⚡', 'Structured concurrency, dispatchers, cancellation and exception handling.'],
    flows: ['🌊', 'Cold and hot flows, StateFlow, SharedFlow, operators and collecting safely.'],
    architecture: ['🏗️', 'MVVM, MVI, Clean Architecture, repositories and modularisation.'],
    di: ['💉', 'Dagger and Hilt: scopes, components, modules, qualifiers and testing.'],
    networking: ['🌐', 'Retrofit, OkHttp, interceptors, caching, token refresh and error handling.'],
    storage: ['💾', 'Room, SQLite, DataStore, migrations and offline-first patterns.'],
    buildtools: ['🛠️', 'Gradle, build variants, R8, signing and build performance.'],
    performance: ['🚀', 'Startup time, memory, jank, profiling and list efficiency.'],
    hr: ['💬', 'Behavioural stories, ownership, conflict and how to present your experience.'],
    sysdesign: ['🧩', 'Design mobile systems end to end: chat, feeds, downloads, payments, offline sync.']
  };
  var topicTab = null, topicTabFor = null, bankErr = null;
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function palette(id) { var k = R.TOPIC_ORDER.indexOf(id); k = (k < 0 ? 0 : k) % 6 + 1; return '--ca:var(--a' + k + ');--cb:var(--b' + k + ')'; }
  function parseHash() {
    var h = location.hash.replace(/^#/, ''); if (h === 'saved') return { v: 'saved' };
    var m = /^topic\/([a-z0-9_]+)$/.exec(h); if (m && index && index.topics[m[1]]) return { v: 'topic', id: m[1] };
    return { v: 'path' };
  }
  var CHEV = '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
  var CHECK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  function statusPill(st) {
    return st === 'completed' ? '<span class="pill strong">Completed</span>' : st === 'in_progress' ? '<span class="pill needs">In progress</span>' : st === 'next' ? '<span class="pill nxt">Next</span>' : '<span class="pill none">Not started</span>';
  }

  function taskHtml(t, state, interactive) {
    var m = state.marks[t.id] || {}, locked = lockedTopics[t.topic] && !isPremium, isDone = !!m.s;
    return '<div class="task' + (isDone ? ' done' : '') + '" data-id="' + esc(t.id) + '">' +
      '<div style="flex:1;min-width:0">' +
      '<a class="t-title" href="' + esc(t.href) + '" target="_self">' + esc(t.title) + '</a>' +
      '<div class="t-meta"><span class="pill ' + esc(t.diff) + '">' + esc(t.diff) + '</span><span>' + t.min + ' min</span><span>· ' + esc(index.topics[t.topic].name) + '</span>' +
      (locked ? '<span class="pill lock">🔒 Premium</span>' : '') + '</div></div>' +
      (interactive ? '<div class="t-right">' +
        '<button type="button" class="ic-btn ic-done" data-act="done" aria-pressed="' + isDone + '" aria-label="' + (isDone ? 'Mark as not done' : 'Mark as done') + '" title="' + (isDone ? 'Done' : 'Mark as done') + '"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>' +

  var lessonsData = null, lessonsErr = null, lessonAt = {};

  }
  function fmt(t) { return esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>'); }

  function highlight(src, lang) {
    if (lang === 'kotlin') {
      return src.replace(/(\/\/[^\n]*)|("(?:\\.|[^"\\\n])*")|('(?:\\.|[^'\\\n])')|(@[A-Za-z]+)|(\b\d+(?:\.\d+)?[Lf]?\b)|([A-Za-z_]\w*)|([\s\S])/g, function (m, cm, st, ch, an, nu, w) {
        if (cm) return '<i class="hl-c">' + esc(cm) + '</i>';
        if (st || ch) return '<i class="hl-s">' + esc(m) + '</i>';
        if (an) return '<i class="hl-a">' + esc(an) + '</i>';
        if (nu) return '<i class="hl-n">' + esc(nu) + '</i>';
        if (w) return KW.test(w) ? '<i class="hl-k">' + w + '</i>' : /^[A-Z]/.test(w) ? '<i class="hl-t">' + w + '</i>' : w;
        return esc(m);
      });

    return esc(src).replace(/(^|\n)(\s*(?:#|\/\/)[^\n]*)/g, '$1<i class="hl-c">$2</i>').replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<i class="hl-c">$1</i>');
  }
  var LANG_NAME = { kotlin: 'Kotlin', xml: 'XML', toml: 'TOML', properties: 'gradle.properties', text: 'Notes' };

    learnHtml.codes = codes;

    }
    var reading = '<section class="ln-read" id="readMore"><h3 class="ln-h3" style="margin-top:0">Further reading</h3><p class="sub" style="font-size:13px;margin:2px 0 12px">Go deeper once the lessons make sense. Official docs open in a new tab.</p>' +
      (own.length ? '<div class="art-grp">On Droidly</div><div class="arts">' + own.map(artRow).join('') + '</div>' : '') +
      (ext.length ? '<div class="art-grp">Official docs and articles</div><div class="arts">' + ext.map(artRow).join('') + '</div>' : '') + '</section>';
    return '<div class="ln-wrap">' + list + main + '</div>' + reading;
  }
  function bindLearn(id) {
    app.querySelectorAll('[data-lesson]').forEach(function (b) {
      b.onclick = function () {
        if (window.DroidlyVoice) DroidlyVoice.stop();
        lessonAt[id] = +b.dataset.lesson; track('roadmap_lesson_open', { topic: id, lesson: lessonAt[id] }); render();
        var top = app.querySelector('.tp-body'); if (top) window.scrollTo({ top: top.getBoundingClientRect().top + window.scrollY - 84, behavior: 'smooth' });
      };
    });
    app.querySelectorAll('[data-copy]').forEach(function (cp) {
      cp.onclick = function () {
        var src = (learnHtml.codes || [])[+cp.dataset.copy]; if (src == null) return;
        try { navigator.clipboard.writeText(src).then(function () { cp.textContent = 'Copied'; setTimeout(function () { cp.textContent = 'Copy'; }, 1500); }); } catch (e) { toast('Copy is not available here.'); }
      };
    });
    var slot = app.querySelector('.ln-listen'), V = window.DroidlyVoice;
    if (slot && V && V.supported) {
      var t = lessonsData[id], k = Math.min(lessonAt[id] || 0, t.lessons.length - 1), l = t.lessons[k], key = 'lesson:' + id + ':' + k;
      var btn = V.button('Listen to this lesson', function () {
        track('voice_play', { from: 'lesson', topic: id, lesson: k });
        var main = app.querySelector('.ln-main');
        V.play([{ key: key, title: (k + 1) + '. ' + l.title, titleEl: main.querySelector('h2'), speakTitle: 'Lesson ' + (k + 1) + '. ' + l.title,
          root: main, opts: { skip: '.ln-step,h2,.ln-toc,.ln-nav,.ln-mis-h', detailsLead: 'Try answering it out loud first. Here is the model answer.' } }]);
      }, key, false);
      slot.appendChild(btn);
    }
    app.querySelectorAll('[data-goto]').forEach(function (b) {
      b.onclick = function () { var el = document.getElementById(b.dataset.goto); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 90, behavior: 'smooth' }); };
    });
    var more = app.querySelector('.ln-more'); if (more) more.onclick = function (e) { e.preventDefault(); var r = document.getElementById('readMore'); if (r) r.scrollIntoView({ behavior: 'smooth' }); };
  }

  function quizPanel(x) {
    if (!bankItems) {
      if (bankErr) return '<p class="empty">Could not load the quiz. Please refresh and try again.</p>';
      loadBank().then(function () { if (view === 'dash' && topicTab === 'quiz') render(); }).catch(function (e) { bankErr = e.message; if (view === 'dash') render(); });
      return '<p class="empty">Loading quiz…</p>';
    }
    var all = bankItems.filter(function (i) { return i.type === 'mcq' && i.topic === x.id; });
    if (!all.length) return '<div class="note-soft">There is no quiz for this topic yet. The practice questions are the best way to check yourself here.</div>';
    var d = R.get().diag || {}, tested = 0, ok = 0;
    Object.keys(d.results || {}).forEach(function (k) { var r = d.results[k]; if (r.topic === x.id) { tested++; if (r.c) ok++; } });
    return '<div class="quiz-box"><h2>Check what you learned</h2><p class="sub">' + Math.min(5, all.length) + ' multiple-choice questions on ' + esc(x.name) + ', about 3 minutes. You see the explanation after each one, and your answers sharpen your readiness estimate.</p>' +
      (tested ? '<p class="dg-note">Answered so far in this topic: ' + ok + ' of ' + tested + ' correct.</p>' : '') +
      '<div class="actions" style="margin-top:16px"><button class="btn" id="topicQuiz" type="button">' + (tested ? 'Take another quiz' : 'Start quiz') + ' ' + CHEV + '</button></div></div>';
  }


  /* ---------- skill check (diagnostic) ---------- */
  var bankItems = null, dg = null;
  var FLAG_TEXT = {
    solid: ['ok', 'Correct.'],
    gap: ['bad', 'Not yet. Now you know where to look.']
  };
  function loadBank() {
    if (bankItems) return Promise.resolve(bankItems);
    return fetch('assets/diagnostic-items.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (j) { bankItems = j.items; return bankItems; });
  }
  function itemHref(ref) {
    var parts = String(ref).split(':'), t = index.topics[parts[0]], hit = null;
    if (t) t.items.forEach(function (it) { if (it.id === ref) hit = it; });
    if (!hit) return null;
    return hit.href ? hit.href : '/questions.html?topic=' + parts[0] + '&q=' + hit.n + '#' + parts[0];
  }
  function diagCtx() {
    var s = R.get(), g = Object.assign({}, R.DEFAULT_GOALS, s.goals);
    return { s: s, g: g, weights: R.weightsFor(g, g.level), jd: s.jd };   // weights without JD: selectMcq applies the JD itself
  }
  function startDiag(source, tid) {
    var c = diagCtx();
    view = 'diag';
    dg = { topic: tid || null, phase: 'loading', runId: 'r' + Date.now(), before: R.readiness(index, c.s).score, level: c.g.level, items: [], i: 0, picked: undefined, answered: false, results: [], written: [], wi: 0, last: null };
    track(tid ? 'topic_quiz_started' : 'diagnostic_started', { source: source || 'unknown', topic: tid || null, has_jd: !!c.s.jd });
    render(); window.scrollTo(0, 0);
    loadBank().then(function (all) {
      var runs = (R.get().diag && R.get().diag.runs) ? R.get().diag.runs.length : 0;
      dg.all = all;
      dg.items = D.selectMcq(all, R.get(), { count: tid ? 5 : 12, perTopic: tid ? 5 : undefined, topics: tid ? [tid] : undefined, level: c.g.level, weights: c.weights, jd: c.jd, seed: runs });
      dg.phase = dg.items.length ? (tid ? 'q' : 'intro') : 'error'; if (!dg.items.length) dg.err = 'no questions available';
      render();
    }).catch(function (e) { dg.phase = 'error'; dg.err = e.message; render(); });
  }
  function leaveDiag() { view = 'dash'; dg = null; render(); window.scrollTo(0, 0); }

  function diagCardHtml(s) {
    var d = s.diag || {}, runs = d.runs || [], last = runs.length ? runs[runs.length - 1] : null;
    if (!last) {
      return '<div class="card" style="margin-top:20px"><h2>Find your real gaps</h2><p class="sub" style="font-size:14px;margin-top:4px">12 multiple-choice questions picked for your level' + (s.jd ? ' and job description' : '') + ', plus two optional written answers. About 10 minutes.</p>' +
        '<p class="dg-note" style="margin-top:12px">Press <b>Rebuild my plan</b> above to take it. Your learning path is then re-ordered from the results.</p></div>';
    }
    var when = new Date(last.t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
    return '<div class="card" style="margin-top:20px"><h2>Skill check</h2><p class="sub" style="font-size:14px;margin-top:4px">Last taken ' + esc(when) + ': ' + last.ok + ' of ' + last.n + ' correct' +
      '. Press <b>Rebuild my plan</b> to retake it with new questions and re-order your path.</p>' +
      '<div class="actions" style="margin-top:14px"><button class="btn ghost small" id="diagResults" type="button">See last results</button></div>' +
      '<p class="dg-note">' + syncNote() + '</p></div>';
  }
  function syncNote() { return 'Saved to your account, so it follows you across devices.'; }
  function showLastResults() {
    var d = R.get().diag || {}, res = [];
    Object.keys(d.results || {}).forEach(function (id) { var r = d.results[id]; res.push({ id: id, type: 'mcq', topic: r.topic, ref: r.ref, d: r.d, c: r.c, k: r.k, flag: r.c ? 'solid' : 'gap' }); });
    Object.keys(d.written || {}).forEach(function (id) { var r = d.written[id]; res.push({ id: id, type: 'written', topic: r.topic, ref: r.ref, d: r.d, s: r.s }); });
    dg = { phase: 'results', fromHistory: true, results: res, written: [], before: null };
    view = 'diag'; render(); window.scrollTo(0, 0);
  }

  function renderDiag() {
    if (!dg) { view = 'dash'; return render(); }
    var h = '';
    if (dg.phase === 'loading') h = '<div class="card" style="max-width:720px;margin:0 auto"><p class="sub">Picking questions…</p></div>';
    else if (dg.phase === 'error') h = '<div class="card" style="max-width:720px;margin:0 auto"><h2>Could not load the questions</h2><p class="sub">Please try again. (' + esc(dg.err || '') + ')</p><div class="actions"><button class="btn ghost" id="dgBack" type="button">Back</button></div></div>';
    else if (dg.phase === 'intro') h = diagIntroHtml();
    else if (dg.phase === 'q') h = diagQuestionHtml();
    else if (dg.phase === 'written') h = diagWrittenHtml();
    else h = diagResultsHtml();
    app.innerHTML = h;
    var back = document.getElementById('dgBack'); if (back) back.onclick = leaveDiag;
    if (dg.phase === 'intro') document.getElementById('dgStart').onclick = function () { dg.phase = 'q'; render(); window.scrollTo(0, 0); };
    if (dg.phase === 'q') bindQuestion();
    if (dg.phase === 'written') bindWritten();
    if (dg.phase === 'results') bindResults();
  }

  function diagIntroHtml() {
    var jd = R.get().jd;
    return '<div class="card" style="max-width:720px;margin:0 auto"><span class="eyebrow">Skill check</span><h1>Find where you actually stand</h1>' +
      '<p class="sub">' + dg.items.length + ' multiple-choice questions at your target level (' + esc(LEVEL_NAME[dg.level]) + ')' + (jd ? ', weighted toward what your job description stresses' : '') + '. Pick the best answer for each, or say you do not know.</p>' +
      '<ul class="ck" style="margin-top:14px"><li class="hit">"I don\'t know" is a fine answer. It tells us where to focus.</li>' +
      '<li class="hit">You see the explanation after every question.</li>' +
      '<li class="hit">At the end, up to two short written answers, checked against a list of expected points. Optional, and not AI.</li></ul>' +
      '<div class="actions"><button class="btn" id="dgStart" type="button">Start</button><button class="link-btn" id="dgBack" type="button">Not now</button></div>' +
      '<p class="dg-note">This is a self-study check, not a test score. Questions are drafted from Droidly answers; if one looks wrong, use the report link under it.</p></div>';
  }

  function progressHtml(i, n, label) {
    return '<div class="dg-prog"><span>' + label + '</span><div class="bar"><i style="width:' + Math.round(100 * i / n) + '%"></i></div></div>';
  }
  function diagQuestionHtml() {
    var it = dg.items[dg.i], n = dg.items.length, ans = dg.answered;
    var opts = it.options.map(function (o, k) {
      var cls = 'opt';
      if (ans) { if (k === it.answer) cls += ' right'; else if (k === dg.picked) cls += ' wrong'; }
      return '<button type="button" class="' + cls + '" data-k="' + k + '" aria-pressed="' + (dg.picked === k) + '"' + (ans ? ' disabled' : '') + '>' + esc(o) + '</button>';
    }).join('');
    var fb = '';
    if (ans) {
      var f = FLAG_TEXT[dg.last.flag], href = itemHref(it.ref);
      fb = '<div class="dg-fb ' + f[0] + '"><b>' + esc(f[1]) + '</b><p style="margin-top:6px">' + esc(it.why) + '</p>' +
        (href ? '<p style="margin-top:6px"><a class="skill-go" href="' + esc(href) + '" target="_blank" rel="noopener">Read the full answer</a></p>' : '') + '</div>';
    }
    var report = 'mailto:support@droidly.io?subject=' + encodeURIComponent('Droidly quiz issue: ' + it.id);
    return '<div class="card" style="max-width:720px;margin:0 auto">' + progressHtml(dg.i + (ans ? 1 : 0), n, 'Question ' + (dg.i + 1) + ' of ' + n + ' · ' + esc(topicName(it.topic))) +
      '<h2 style="font-size:19px;line-height:1.4">' + esc(it.q) + '</h2><div role="group" aria-label="Answers">' + opts + '</div>' + fb +
      '<div class="actions" style="margin-top:20px">' + (ans ? '<button class="btn" id="dgNext" type="button">' + (dg.i + 1 < n ? 'Next question ›' : 'Continue ›') + '</button>' :
        '<button class="btn" id="dgCheck" type="button" disabled>Check answer</button><button class="link-btn" id="dgDk" type="button">I don\'t know</button>') +
      '<a class="link-btn" style="margin-left:auto" href="' + esc(report) + '">Report a problem with this question</a></div></div>';
  }
  function bindQuestion() {
    var chk = document.getElementById('dgCheck'), it = dg.items[dg.i];
    function sync() { if (chk) chk.disabled = (dg.picked === undefined || dg.picked === null); }
    app.querySelectorAll('.opt').forEach(function (b) {
      b.onclick = function () {
        if (dg.answered) return;
        dg.picked = +b.dataset.k;
        app.querySelectorAll('.opt').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
        sync();
      };
    });
    function grade(choice, conf) {
      var res = D.gradeMcq(it, choice, conf);
      dg.results.push(res); dg.last = res; dg.answered = true; dg.picked = choice;
      R.recordDiag([res], { run: dg.runId });   // saved as you go, so closing the tab midway keeps what you answered
      render();
    }
    if (chk) chk.onclick = function () { if (!chk.disabled) grade(dg.picked, 'think'); };
    var dk = document.getElementById('dgDk'); if (dk) dk.onclick = function () { grade(null, 'guess'); };
    var nx = document.getElementById('dgNext');
    if (nx) nx.onclick = function () {
      dg.i++; dg.picked = undefined; dg.answered = false; dg.last = null;
      if (dg.i >= dg.items.length) { if (dg.topic) { dg.phase = 'results'; finishDiag(); } else prepareWritten(); }
      render(); window.scrollTo(0, 0);
    };
  }

  function prepareWritten() {
    var c = diagCtx(), sum = D.summarize(dg.results);
    dg.written = D.selectWritten(dg.all, R.get(), { count: 2, gapTopics: sum.gaps, weights: c.weights, jd: c.jd, level: c.g.level });
    dg.wi = 0; dg.wres = null; dg.text = '';
    dg.phase = dg.written.length ? 'written' : 'results';
    if (dg.phase === 'results') finishDiag();
  }
  function diagWrittenHtml() {
    var w = dg.written[dg.wi], n = dg.written.length, res = dg.wres;
    var body = '';
    if (!res) {
      body = '<textarea class="dg-ta" id="dgText" placeholder="Write it the way you would say it in an interview. Aim for 4–8 sentences." aria-label="Your answer">' + esc(dg.text || '') + '</textarea>' +
        '<div class="dg-note" id="dgWc">0 words</div>' +
        '<div class="actions" style="margin-top:14px"><button class="btn" id="dgGrade" type="button">Check against the key points</button><button class="link-btn" id="dgSkipW" type="button">Skip written answers</button></div>';
    } else {
      body = '<p class="sub" style="font-size:14px">You covered <b>' + res.matched + ' of ' + res.total + '</b> expected points' + (res.short ? ' (answer was short, so the score is scaled down)' : '') + '.</p>' +
        '<ul class="ck">' + res.hits.map(function (h) { return '<li class="' + (h.hit ? 'hit' : '') + '">' + esc(h.label) + '</li>'; }).join('') + '</ul>' +
        '<div class="dg-fb"><b>How to read this.</b> It checks whether your answer mentions each expected point. It cannot judge whether your reasoning is right, and a different valid wording can be missed, so treat unchecked points as prompts to review, not as a verdict.<p style="margin-top:6px">' + esc(w.why) + '</p>' +
        (itemHref(w.ref) ? '<p style="margin-top:6px"><a class="skill-go" href="' + esc(itemHref(w.ref)) + '" target="_blank" rel="noopener">Read the full answer</a></p>' : '') + '</div>' +
        '<div class="actions"><button class="btn" id="dgWNext" type="button">' + (dg.wi + 1 < n ? 'Next written question ›' : 'See results ›') + '</button></div>';
    }
    return '<div class="card" style="max-width:720px;margin:0 auto">' + progressHtml(dg.items.length + dg.wi + (res ? 1 : 0), dg.items.length + n, 'Written answer ' + (dg.wi + 1) + ' of ' + n + ' · ' + esc(topicName(w.topic))) +
      '<h2 style="font-size:19px;line-height:1.4">' + esc(w.q) + '</h2>' + body + '</div>';
  }
  function bindWritten() {
    var ta = document.getElementById('dgText'), w = dg.written[dg.wi];
    if (ta) {
      var wc = document.getElementById('dgWc');
      var upd = function () { dg.text = ta.value; var n = (ta.value.trim().match(/\S+/g) || []).length; wc.textContent = n + ' word' + (n === 1 ? '' : 's') + (n < D.MIN_WORDS_FULL ? ' · short answers are scaled down' : ''); };
      ta.oninput = upd; upd();
      document.getElementById('dgGrade').onclick = function () {
        var res = D.gradeWritten(w, ta.value); dg.wres = res; dg.results.push(res); R.recordDiag([res], { run: dg.runId }); render();
      };
      document.getElementById('dgSkipW').onclick = function () { dg.phase = 'results'; finishDiag(); render(); window.scrollTo(0, 0); };
    }
    var nx = document.getElementById('dgWNext');
    if (nx) nx.onclick = function () {
      dg.wi++; dg.wres = null; dg.text = '';
      if (dg.wi >= dg.written.length) { dg.phase = 'results'; finishDiag(); }
      render(); window.scrollTo(0, 0);
    };
  }

  function finishDiag() {
    if (dg.finished) return; dg.finished = true;
    R.ensurePlan(index, !dg.topic);
    var sum = D.summarize(dg.results);
    dg.after = R.readiness(index, R.get()).score;
    track(dg.topic ? 'topic_quiz_completed' : 'diagnostic_completed', { topic: dg.topic || null, answered: sum.answered, correct: sum.correct, gap_topics: sum.gaps.length });
  }
  function topicQuizResultsHtml() {
    var sum = D.summarize(dg.results), tn = topicName(dg.topic);
    var missed = dg.results.filter(function (r) { return r.type !== 'written' && !r.c; }).map(function (r) {
      var q = dg.items.filter(function (it) { return it.id === r.id; })[0], href = itemHref(r.ref);
      return q ? '<li>' + esc(q.q) + (href ? ' <a class="skill-go" style="display:inline;margin:0" href="' + esc(href) + '" target="_blank" rel="noopener">Read the answer</a>' : '') + '</li>' : '';
    }).join('');
    return '<div class="card" style="max-width:720px;margin:0 auto"><span class="eyebrow">Topic quiz · ' + esc(tn) + '</span>' +
      '<div class="dg-big">' + sum.correct + ' of ' + sum.answered + ' correct</div>' +
      (dg.before != null && dg.after != null ? '<p class="sub" style="font-size:14px">Interview readiness: <b>' + dg.before + '</b> → <b>' + dg.after + '</b>' + (dg.after === dg.before ? ' (no change)' : '') + '.</p>' : '') +
      (missed ? '<div class="q-label" style="margin-top:20px">Worth another look</div><ul class="ck">' + missed + '</ul>' : '<p class="sub" style="margin-top:14px">Clean sweep. Mark the topic complete when you feel ready.</p>') +
      '<div class="actions"><button class="btn" id="dgPlan" type="button">Back to ' + esc(tn) + ' ' + CHEV + '</button><button class="btn ghost" id="dgAgain" type="button">Take another quiz</button></div>' +
      '<p class="dg-note">' + syncNote() + '</p></div>';
  }
  function diagResultsHtml() {
    if (dg.topic) return topicQuizResultsHtml();
    var sum = D.summarize(dg.results);
    var skills = R.skillsToImprove(index, R.get(), { limit: 3 });
    var change = (dg.before != null && dg.after != null)
      ? '<p class="sub" style="font-size:14px">Interview readiness: <b>' + dg.before + '</b> → <b>' + dg.after + '</b>' + (dg.after === dg.before ? ' (no change)' : '') + '. This is an estimate that blends your ratings, marks and these answers.</p>' : '';
    return '<div class="card" style="max-width:720px;margin:0 auto"><span class="eyebrow">' + (dg.fromHistory ? 'Latest results across your checks' : 'Skill check complete') + '</span>' +
      '<div class="dg-big">' + sum.correct + ' of ' + sum.answered + ' correct</div>' +
      change +
      '<div class="q-label" style="margin-top:20px">By topic, weakest first</div>' +
      sum.topics.map(function (o) {
        var parts = o.answered ? o.correct + '/' + o.answered + ' correct' : '';
        var wr = o.written.length ? (parts ? ' · ' : '') + 'written ' + Math.round(100 * o.written.reduce(function (a, b) { return a + b; }, 0) / o.written.length) + '%' : '';
        return '<div class="dg-row"><span class="nm">' + esc(topicName(o.topic)) + '</span><div class="bar"><i class="' + (o.pct >= 75 ? '' : o.pct >= 50 ? 'needs' : 'weak') + '" style="width:' + o.pct + '%"></i></div><small>' + parts + wr + '' + '</small></div>';
      }).join('') +
      '<div class="q-label" style="margin-top:24px">What to work on first</div>' + skillsHtml(skills) +
      '<div class="actions"><button class="btn" id="dgPlan" type="button">See my updated plan ›</button>' + '' + '</div>' +
      '<p class="dg-note">Written answers measure coverage of expected points only. ' + syncNote() + '</p></div>';
  }
  function bindResults() {
    document.getElementById('dgPlan').onclick = function () { leaveDiag(); };
    var again = document.getElementById('dgAgain'); if (again) again.onclick = function () { startDiag('retake', dg.topic || undefined); };
    app.querySelectorAll('[data-skill]').forEach(function (a) { a.addEventListener('click', function () { track('roadmap_skill_clicked', { topic: a.dataset.skill, from: 'diagnostic' }); }); });
  }

  /* ---------- boot ---------- */
  window.addEventListener('hashchange', function () { if (window.DroidlyVoice) DroidlyVoice.stop(); if (index && authReady && view === 'dash') { render(); window.scrollTo(0, 0); } });
  R.load();   // also removes anything older versions left in this browser
  R.onChange(function () { if (index && view && view !== 'diag' && authReady) render(); });   // the quiz saves as you go; do not redraw it under the user
  fetch('assets/roadmap-index.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (j) {
    index = j;
    if (authReady) settle(loadErr);
    track('roadmap_viewed', { has_goals: !!R.get().goals });
  }).catch(function (e) {
    app.innerHTML = '<div class="card"><h2>Couldn\'t load the roadmap</h2><p class="sub">Please refresh. If it keeps happening, email support@droidly.io. (' + esc(e.message) + ')</p></div>';
  });

  function signedOut() { R.clearLocal(); isPremium = false; dg = null; view = null; settle(); }
  function loadFor(session, event) {
    return R.sync().then(function (res) {
      if (!res || !res.ok) return settle((res && res.reason) || 'network');
      return loadEntitlements().then(function () {
        if (view === 'diag') { authReady = true; return; }   // never redraw a quiz in progress
        settle();
        if (event === 'SIGNED_IN') toast('Signed in. Progress loaded.');
      });
    });
  }
  db.auth.onAuthStateChange(function (event, session) {
    setUser(session ? session.user : null);
    if (session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) loadFor(session, event);
    else if (event === 'SIGNED_OUT') signedOut();
    else if (event === 'INITIAL_SESSION') { R.clearLocal(); loadEntitlements().then(function () { settle(); }); }
  });
  setTimeout(function () { if (!authReady) { R.clearLocal(); settle(); } }, 6000);   // auth client never answered: treat as signed out
})();
</script>
</body>
</html>
